# Ejemplo de Cargo.toml RAÍZ de un workspace con herencia de metadatos y dependencias.
# (Este es el patrón que usan los proyectos grandes: una sola fuente de verdad para versiones.)

[workspace]
resolver = "3"
members = ["crates/*"]            # un crate por carpeta dentro de crates/
default-members = ["crates/app"]  # lo que compila `cargo build` sin -p

# Metadatos compartidos: los crates los heredan con `version.workspace = true`
[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tu-usuario/tu-proyecto"
authors = ["Tu Nombre <tu@correo.com>"]

# Dependencias con versión única para todo el workspace
[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
# Crates internos: ruta + versión (necesaria para publicar)
mi_nucleo = { path = "crates/nucleo", version = "0.3.1" }

# Lints compartidos
[workspace.lints.rust]
unsafe_code = "forbid"
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Los perfiles SOLO se leen en el Cargo.toml raíz
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2                    # optimiza las dependencias aunque compiles en debug (tests más rápidos)

